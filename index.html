<!DOCTYPE html>
<html>
<head>
  <title>Employee Leave System</title>
   <link rel="stylesheet" href="style.css">
   <!-- Add this in <head> -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .section { margin-bottom: 30px; }
    #managerLoginSection, #employeeLoginSection, #employeeDashboard, #managerDashboard { display: none; }
    button { margin: 5px; padding: 5px 10px; }
    .role-btn { font-size: 16px; }
    table { border-collapse: collapse; margin: 10px 0; }
    th, td { border: 1px solid #999; padding: 6px 12px; }
    .status-approved { color: green; font-weight: bold; }
    .status-rejected { color: red; font-weight: bold; }
    .status-pending { color: gray; font-weight: bold; }
    .error { color: red; font-weight: bold; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div id="loginPage" class="main-container">
  <div class="logo-container">
    <img src="logo.png" alt="Company Logo" />
  </div>
  <div class="login-container">
    <!-- Role Selection -->
    <div id="roleSelection" class="section">
      <h1>Select Role</h1>
      <button class="role-btn" onclick="showManagerLogin()">Manager</button>
      <button class="role-btn" onclick="showEmployeeLogin()">Employee</button>
    </div>

    <!-- Manager Login -->
    <div id="managerLoginSection" class="section">
      <h2>Manager Login</h2>
      <form id="managerLoginForm">
        <input type="text" id="username" placeholder="Manager Username" required />
        <input type="password" id="password" placeholder="Password" required />
        <button type="submit">Login</button>
      </form>
      <p id="loginError" class="error"></p>
    </div>

    <!-- Employee Login -->
    <div id="employeeLoginSection" class="section">
      <h2>Employee Login</h2>
      <form id="employeeLoginForm">
        <input type="number" id="emp_id" placeholder="Employee ID" required />
        <input type="password" id="emp_password" placeholder="Password" required />
        <button type="submit">Login</button>
      </form>
      <p id="employeeLoginError" class="error"></p>
    </div>
  </div>
</div>

<!-- Main Content After Login -->
<div id="mainContent" style="display:none;">
  <!-- This is your dashboard, leave stats, etc. -->
</div>


<!-- Employee Dashboard -->
<div id="employeeDashboard" class="unified-card">

  <!-- Welcome Card -->
  <div class="unified-card">
    <h2>Welcome, <span id="empName"></span>!</h2>
    <div class="leave-info" style="font: bold;">
      <span class="leave-count"><span id="empLeaves"></span></span>
      <span>Leaves Remaining</span>
    </div>
    <p id="approvalMsg" class="status-pending" style="font: bold;"></p>
  </div>

  <!-- Profile Card -->
  
    <h2>Profile</h2>
    <div class="profile-row"><span>Email:</span> <span id="empEmail"></span></div>
    <div class="profile-row"><span>Contact:</span> <span id="empContact"></span></div>
    <div class="profile-row"><span>Department:</span> <span id="empDept"></span></div>
  

  <!-- Request Leave Card -->
 
    <h3>Request Leave</h3>
    <form id="requestLeaveForm" class="leave-form">
      <input type="date" id="from_date" required />
      <input type="date" id="to_date" required />
      <input type="text" id="reason" placeholder="Reason" required />
      <button type="submit">Submit</button>
    </form>
    <p id="leaveRequestMsg" class="error"></p>
  

  <!-- Current Requests Card -->
  
    <h3>Your Leave Requests</h3>
    <ul id="employeeRequestsList" class="requests-list"></ul>
 

  <!-- Leave History Card -->
 
    <h3>Leave History</h3>
    <div class="filters">
      <label for="filterMonth">Month:</label>
      <select id="filterMonth">
        <option value="">All</option>
        <option value="1">January</option>
        <option value="2">February</option>
        <option value="3">March</option>
        <option value="4">April</option>
        <option value="5">May</option>
        <option value="6">June</option>
        <option value="7">July</option>
        <option value="8">August</option>
        <option value="9">September</option>
        <option value="10">October</option>
        <option value="11">November</option>
        <option value="12">December</option>
      </select>

      <label for="filterYear">Year:</label>
      <input type="number" id="filterYear" placeholder="YYYY" />

      <label for="filterStatus">Status:</label>
      <select id="filterStatus">
        <option value="">All</option>
        <option value="approved">Approved</option>
        <option value="rejected">Rejected</option>
        <option value="pending">Pending</option>
      </select>

      <button onclick="loadEmployeeHistory()">Apply Filters</button>
    </div>
    <ul id="employeeHistoryList" class="history-list"></ul>
 

</div>




<!-- Manager Dashboard -->
<div id="managerDashboard">
  <h2>Manager Dashboard</h2>

 <!-- Existing All Employees Table -->
<div class="manager-card">

 
  <button onclick="openEmployeeForm()" style="margin-bottom:20px;">+ Add Employee</button>
  <!-- Department Filter -->
 
  <select id="deptFilter" onchange="filterEmployees()">
    <option value="">All</option>
    <option value="HR">HR</option>
    <option value="IT">IT</option>
    <option value="Finance">Finance</option>
    <option value="Developer">Developer</option>

  </select>

  <!-- Employee Cards -->
  <div id="employeeList"></div>

  <!-- Show More Button -->
  <button id="showMoreBtn" onclick="showMoreEmployees()">Show More</button>
</div>



  <!-- <div class="manager-card">
    <h3>Employee Leaves Overview</h3>
    <canvas id="managerLeaveChart"></canvas>
  </div> -->

  <div class="manager-card">
    <h3>Leave Requests</h3>
    <ul id="requestsList"></ul>
    <!-- <p id="managerError" class="error"></p> -->
  </div>

  <div class="manager-card">
    <h3>📊 Leave Statistics</h3>
    <canvas id="monthlyStats"></canvas>
    <canvas id="departmentStats"></canvas>
  </div>
</div>

<div id="employeeFormModal" class="section" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:#fff; padding:20px; border-radius:12px; box-shadow:0 8px 20px rgba(0,0,0,0.3); z-index:1000;">
  <h3 id="formTitle">Add Employee</h3>
  <form id="employeeForm">
    <input type="hidden" id="emp_id_form" />
    <input type="text" id="emp_name_form" placeholder="Name" required />
    <input type="number" id="emp_total_leaves_form" placeholder="Total Leaves" required />
    <input type="text" id="emp_department_form" placeholder="Department" required />
    <input type="password" id="emp_password_form" placeholder="Password" required />
    <input type="email" id="emp_email_form" placeholder="Email" required />
    <input type="text" id="emp_contact_form" placeholder="Contact" required />

    <div style="margin-top:10px;">
      <button type="submit" id="saveEmployeeBtn">Save</button>
      <button type="button" onclick="closeEmployeeForm()">Cancel</button>
    </div>
  </form>
</div>

<!-- Add/Edit Employee Modal -->



<script src="scripts.js"></script>

</body>
</html>
